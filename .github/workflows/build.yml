name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Jika repo berisi project.zip, bongkar dulu. Jika project sudah berupa folder, langsung dipakai.
      - name: Siapkan project
        run: |
          if [ -f project.zip ]; then
            rm -rf _proj && mkdir _proj
            unzip -q project.zip -d _proj
          fi
          S=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$S" ]; then echo "settings.gradle.kts tidak ditemukan"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # Kalau gagal, ringkasan error muncul di halaman run (mudah disalin dari HP)
      - name: Ringkasan error
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          {
            echo '## Build gagal'
            echo '```'
            grep -E '^e: |error:|What went wrong|Could not|FAILED' -A4 build.log | head -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rilis APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MixBase build ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
